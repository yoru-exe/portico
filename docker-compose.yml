# Example: automatic HTTPS in front of an app.
# 1. Point your DNS at this machine.   2. Create ./Porticofile (see the bottom of this file).   3. docker compose up -d
services:
  portico:
    image: ghcr.io/yoru-exe/portico:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    sysctls:
      # lets the non-root container user bind ports 80/443 (already the default on Docker >= 20.10)
      - net.ipv4.ip_unprivileged_port_start=0
    command: ["run", "-config", "/etc/portico/Porticofile"]
    volumes:
      - ./Porticofile:/etc/portico/Porticofile:ro
      - ./site:/srv:ro
      - portico-data:/data # keeps certificates across restarts

  app:
    image: traefik/whoami # replace with your own backend
    restart: unless-stopped

volumes:
  portico-data:

# Porticofile for the setup above:
# {
#   listen :80
#   tls auto you@example.com
#   redirect_http
#   http3
#   encode gzip
# }
#
