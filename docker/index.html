<h1>Welcome to Portico</h1>
<p>If you can see this page, the server is installed and running.</p>
<p>Serve your own site by mounting it at <code>/srv</code>, or mount a config at
<code>/etc/portico/portico.json</code>:</p>
<pre>docker run -p 8080:8080 -v ./site:/srv:ro ghcr.io/yoru-exe/portico</pre>
<p>Docs: <a href="https://github.com/yoru-exe/portico">github.com/yoru-exe/portico</a></p>
